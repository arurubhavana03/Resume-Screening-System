<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Screening System</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <h2 class="card-title text-center text-primary mb-4 fw-bold">
                            AI Resume Screening System
                        </h2>
                        <p class="text-muted text-center mb-4">
                            Upload a candidate's resume (PDF) and paste the job description to calculate the match percentage.
                        </p>
                        
                        <form action="/upload" method="POST" enctype="multipart/form-data">
                            <div class="mb-4">
                                <label for="resume" class="form-label fw-semibold">Upload Resume (PDF)</label>
                                <input type="file" class="form-control form-control-lg" id="resume" name="resume" accept=".pdf" required>
                            </div>

                            <div class="mb-4">
                                <label for="job_description" class="form-label fw-semibold">Job Description</label>
                                <textarea class="form-control" id="job_description" name="job_description" rows="6" placeholder="Paste the target job description skills and requirements here..." required></textarea>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">
                                    Analyze Resume Match
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
