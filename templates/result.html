<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screening Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg border-0 rounded-4 mb-4">
                    <div class="card-body p-5 text-center">
                        <h2 class="fw-bold mb-3">ATS Screening Match Score</h2>
                        
                        <!-- Visual Score Badge -->
                        <div class="display-3 fw-bold text-success my-3">
                            {{ score }}%
                        </div>
                        
                        <!-- Dynamic Progress Bar -->
                        <div class="progress my-4" style="height: 25px;">
                            <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" 
                                 role="progressbar" 
                                 style="width: {{ score }}%;" 
                                 aria-valuenow="{{ score }}" 
                                 aria-valuemin="0" 
                                 aria-valuemax="100">
                                {{ score }}% Match
                            </div>
                        </div>

                        <a href="/" class="btn btn-outline-primary btn-lg rounded-pill fw-bold mt-2">
                            ← Upload Another Resume
                        </a>
                    </div>
                </div>

                <!-- Accordion for Extracted Resume Text -->
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <h4 class="fw-bold mb-3">Extracted Resume Content</h4>
                        <div class="p-3 bg-white border rounded text-muted" style="max-height: 300px; overflow-y: auto; white-space: pre-wrap;">{{ resume_text }}</div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
